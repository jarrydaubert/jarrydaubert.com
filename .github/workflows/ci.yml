name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  repo-health:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Lockfile policy guard
        shell: bash
        run: |
          set -euo pipefail
          for f in package-lock.json yarn.lock pnpm-lock.yaml bun.lockb; do
            if [ -f "$f" ]; then
              echo "Disallowed lockfile present: $f"
              exit 1
            fi
          done

      - name: Tracked env guard
        shell: bash
        run: |
          set -euo pipefail
          # Block any tracked live env file (.env, .env.local, .env.production, ...)
          # while allowing example/template files (.env.example, .env.local.example).
          bad_env_files="$(git ls-files | awk '
            /(^|\/)\.env($|\.)/ && $0 !~ /(^|\/)\.env(\..*)?\.example$/ { print }
          ')"

          if [ -n "$bad_env_files" ]; then
            echo "::error::Do not commit live env files. Move secrets to provider env vars:"
            echo "$bad_env_files"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Repo checks
        run: bun run check:repo

      - name: Build
        run: bun run build
